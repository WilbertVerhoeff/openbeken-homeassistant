name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Check test lint and formatting
        run: |
          ruff check tests
          ruff format --check tests
      - name: Run tests with branch coverage
        run: python -m pytest -q --durations=10
      - name: Require complete config-flow coverage
        run: python -m coverage report --include=custom_components/openbeken/config_flow.py --fail-under=100
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
